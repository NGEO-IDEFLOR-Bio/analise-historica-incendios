[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analise-historica-incendios"
version = "0.1.0"
description = "Análise temporal e espacial de incêndios nas Unidades de Conservação do IDEFLOR-Bio (Pará)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "requests>=2.31.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "jupyterlab>=4.0.0"
]
gee = [
    "earthengine-api>=0.1.370",
    "geemap>=0.30.0"
]
